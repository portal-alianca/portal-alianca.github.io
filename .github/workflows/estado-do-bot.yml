# Perguntar ao Fly como está a máquina do bot -- sem publicar nada.
#
# Isto existe porque houve uma noite inteira de "nem uma função tá indo" sem
# nenhuma forma de saber, daqui, se o processo estava de pé. O deploy tinha
# passado, o código subia limpo, e mesmo assim nada respondia. Faltava um fato:
# a máquina está rodando, ou está reiniciando em círculo?
#
# POR QUE SÓ O ESTADO, E NUNCA O LOG
#
# Este repositório é PÚBLICO, e log de Actions em repositório público é
# público. O `fly logs` do bot carrega nome de servidor de cliente, id de
# pessoa e corpo de resposta do banco -- exatamente o que a página de
# privacidade promete não espalhar. Um comando a mais aqui, escrito com pressa
# num dia de bot caído, vazaria dados de quem confiou no produto num lugar
# indexável pelo Google e impossível de despublicar.
#
# `status` e `machine list` mostram id de máquina, região, imagem e estado.
# Não há dado de ninguém neles. É a única coisa que este arquivo pode fazer, e
# é de propósito.
#
# Roda só na mão: aba Actions -> "Estado da máquina do bot" -> Run workflow.
# Não faz deploy, não reinicia nada, não muda nada.

name: Estado da máquina do bot

on:
  workflow_dispatch:

jobs:
  estado:
    name: fly status
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Conferir se o segredo existe
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "::error::Falta o secret FLY_API_TOKEN."
            exit 1
          fi

      # `|| true` nos dois: uma máquina destruída faz o flyctl sair com erro, e
      # é justamente esse o caso que se quer enxergar. Falhar o job aqui
      # esconderia a resposta atrás de um X vermelho.
      - name: Estado do app
        working-directory: discord-bot-gateway
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl status || true

      - name: Máquinas, uma a uma
        working-directory: discord-bot-gateway
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl machine list || true

      # A frase exata com que ele morre -- e SO' ela.
      #
      # O `fly logs` inteiro nao pode aparecer aqui: repositorio publico, e o
      # log carrega nome de servidor de cliente, id de pessoa e corpo de
      # resposta do banco. Mas as duas unicas mensagens de morte na partida
      # sao escritas por mim, e nao tem dado de ninguem dentro:
      #
      #   FATAL: nao consegui entrar no Discord: <o que o Discord respondeu>
      #   Faltou a variavel de ambiente <NOME>
      #
      # Entao o filtro e' uma lista fechada dessas duas, cortada em 200
      # caracteres. Tudo o mais e' jogado fora antes de virar saida. Filtro
      # frouxo aqui vazaria dado de cliente num lugar indexavel; por isso ele
      # e' por prefixo exato, e nao por palavra solta.
      - name: O que ele diz ao morrer
        working-directory: discord-bot-gateway
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          # O `|| echo` da primeira versao estava preso ao `head`, que NUNCA
          # falha -- entao o passo terminou sem imprimir uma linha e sem dizer
          # que nao achou nada. Mesmo defeito do id da maquina, duas horas
          # antes. Aqui a decisao e' explicita: guarda, conta, e fala.
          timeout 40 flyctl logs --no-tail > /tmp/bruto.txt 2>/tmp/erro.txt || true
          linhas=$(wc -l < /tmp/bruto.txt || echo 0)
          echo "O log devolveu $linhas linha(s)."
          if [ "$linhas" -eq 0 ]; then
            echo "Nao consegui ler log nenhum. O flyctl disse:"
            cut -c1-200 /tmp/erro.txt | head -5
            exit 0
          fi

          # Lista fechada de linhas que NAO tem dado de ninguem dentro: as duas
          # que eu escrevo ao morrer, e os erros que o proprio Node gera. Nome
          # de servidor, id de pessoa e resposta do banco nunca casam com
          # nenhuma delas, e e' por isso que isto pode aparecer num log publico.
          achado=$(grep -E "(FATAL: nao consegui entrar no Discord|Faltou a variavel de ambiente|Error \[ERR_|SyntaxError|ReferenceError|TypeError: |Cannot find (module|package))" /tmp/bruto.txt \
            | cut -c1-200 | sort -u | head -8 || true)
          if [ -z "$achado" ]; then
            echo "Nenhuma linha de morte conhecida no que eu li."
          else
            echo "$achado"
          fi

      # Quais segredos existem, e desde quando.
      #
      # `secrets list` mostra NOME, DIGEST e data -- nunca o valor. Isso separa
      # as duas unicas saidas com codigo 1 que existem no bot: falta de
      # variavel de ambiente (sai em menos de um segundo, sem tocar a rede) e
      # login recusado pelo Discord (leva segundos, porque tenta conectar).
      #
      # A data tambem conta se alguem trocou um segredo recentemente, que e' a
      # pergunta seguinte quando o login e' recusado.
      - name: Quais segredos existem
        working-directory: discord-bot-gateway
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl secrets list || true

      # Por que a máquina parou.
      #
      # `status` diz que ela está parada; só o histórico de eventos diz por
      # quê -- e é a diferença entre "estourou a memória" e "o processo saiu
      # sozinho no primeiro segundo", que pedem consertos opostos.
      #
      # O histórico é infraestrutura: código de saída, sinal, quem pediu a
      # parada. Não há dado de cliente nele, e é por isso que ele pode
      # aparecer aqui enquanto o `fly logs` não pode.
      - name: Por que ela parou
        working-directory: discord-bot-gateway
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          # O id sai do JSON por um parser de JSON, e nao por grep: o flyctl
          # imprime `"id": "abc"` com espaco depois dos dois-pontos, e a
          # primeira versao disto -- um grep que exigia `"id":"abc"` -- nao
          # achou nada e o passo terminou VERDE sem imprimir uma linha. Passo
          # que falha em silencio e' pior que passo nenhum: aqui ele custou
          # uma ida e volta inteira numa noite de bot caido.
          ids=$(flyctl machine list --json 2>/dev/null \
            | python3 -c 'import json,sys; print(" ".join(m["id"] for m in json.load(sys.stdin)))' \
            || true)
          if [ -z "$ids" ]; then
            echo "Nao consegui listar as maquinas para pedir o historico."
            exit 0
          fi
          for id in $ids; do
            echo "===== maquina $id ====="
            flyctl machine status "$id" || true
          done
