# O bot de conexão permanente não vive no GitHub Pages como o resto do portal:
# ele é um processo Node que precisa de um host ligado 24h (Fly.io). Sem este
# workflow, mudar o index.js do bot não muda nada no Discord até alguém rodar
# `fly deploy` de um computador com flyctl instalado.
#
# Para ligar, uma vez só:
#   1. fly.io → Account → Access Tokens → criar um token
#   2. neste repositório: Settings → Secrets and variables → Actions →
#      New repository secret → nome FLY_API_TOKEN, valor o token do passo 1
# Os dois passos funcionam pelo navegador do celular.

name: Deploy do bot do Discord

on:
  push:
    branches: [main]
    paths:
      - "discord-bot-gateway/**"
      - ".github/workflows/deploy-bot.yml"
  workflow_dispatch: # permite disparar na mão, pela aba Actions

jobs:
  # Vermelho aqui IMPEDE a subida. Antes disto, mesclar um pull request pelo
  # navegador levava o bot ao ar sem que uma linha de teste rodasse -- o
  # publicar.sh roda a suíte, mas é script local, e só protege quem publica do
  # próprio computador.
  testes:
    uses: ./.github/workflows/testes-bot.yml

  deploy:
    name: fly deploy
    needs: testes
    runs-on: ubuntu-latest
    # Dois deploys ao mesmo tempo brigam pela mesma máquina; o último ganha.
    concurrency:
      group: deploy-discord-bot
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Conferir se o segredo existe
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "::error::Falta o secret FLY_API_TOKEN. Veja o comentário no topo deste arquivo."
            exit 1
          fi

      - name: Deploy
        working-directory: discord-bot-gateway
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --remote-only

      # Deploy verde com o bot desligado.
      #
      # `fly deploy` NAO liga uma maquina que ja estava parada: ele troca a
      # imagem e respeita o estado em que a encontrou. Uma vez que a maquina
      # pare -- por queda repetida, por parada na mao, pelo que for --, todo
      # deploy seguinte passa verde atualizando um bot desligado, e o painel
      # do GitHub jura que esta tudo certo.
      #
      # Foi exatamente isso: quatro deploys seguidos em verde, e o Discord
      # dizendo "o aplicativo nao respondeu" em tudo, porque nao havia
      # processo nenhum. O histórico da maquina mostrava `stopped/update` e
      # nenhum `start` depois.
      #
      # `machine start` numa maquina ja ligada devolve erro; o `|| true` e' por
      # isso, e nao para esconder falha.
      - name: Ligar o que estiver parado
        working-directory: discord-bot-gateway
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          ids=$(flyctl machine list --json 2>/dev/null \
            | python3 -c 'import json,sys; print(" ".join(m["id"] for m in json.load(sys.stdin) if m.get("state") != "started"))' \
            || true)
          if [ -z "$ids" ]; then
            echo "Nenhuma maquina parada."
          else
            for id in $ids; do
              echo "Ligando $id"
              flyctl machine start "$id" || true
            done
          fi

      # ESPERAR a maquina assentar, e reprovar o deploy se ela nao assentar.
      #
      # O passo "Como ficou" abaixo ja existia e nao servia para o que foi
      # feito. Ele roda tres segundos depois do deploy, e tres segundos depois
      # a maquina ainda esta trocando: dois deploys seguidos foram conferidos e
      # o estado impresso foi `replacing` num e `created` no outro. Nenhum dos
      # dois e' `started`. Quer dizer que o passo criado para PROVAR que o bot
      # subiu estruturalmente nunca conseguia provar -- ele sempre olha cedo
      # demais --, e o check verde seguia valendo tanto quanto antes.
      #
      # Isso importa aqui mais do que pareceria: uma vez o bot passou doze
      # horas fora do ar com todos os deploys em verde. Um check que nao pode
      # falhar e' pior que check nenhum, porque ensina a confiar nele.
      #
      # Agora o passo pergunta ate' a maquina chegar em `started`, e FALHA se
      # ela nao chegar. Verde volta a significar "o bot esta de pe".
      - name: Esperar a maquina ligar de verdade
        working-directory: discord-bot-gateway
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          # O veredito sai do python, e nao de um grep espertinho no shell:
          # "todas ligadas" e' a condicao que decide se o deploy passa, e ela
          # tem que ser legivel por quem for mexer nisto depois.
          #
          # Maquina nenhuma na lista NAO e' sucesso: seria o bot inexistente
          # passando como bot de pe.
          veredito='
          import json, sys
          try:
              ms = json.load(sys.stdin)
          except Exception:
              print("SEM RESPOSTA"); sys.exit()
          if not ms:
              print("NENHUMA MAQUINA"); sys.exit()
          estados = [m.get("state", "?") for m in ms]
          print(("TODAS DE PE: " if all(e == "started" for e in estados) else "AINDA NAO: ")
                + ", ".join(estados))
          '
          for tentativa in $(seq 1 30); do
            saida=$(flyctl machine list --json 2>/dev/null | python3 -c "$(echo "$veredito" | sed 's/^          //')" || echo "SEM RESPOSTA")
            echo "tentativa $tentativa: $saida"
            case "$saida" in
              "TODAS DE PE: "*) exit 0 ;;
            esac
            sleep 5
          done
          echo "::error::A maquina nao chegou em 'started' em 150s. O bot pode estar fora do ar."
          exit 1

      # O estado final no log do deploy, sempre. Sem isto, "deu certo" e' uma
      # inferencia; com isto, e' uma linha que se le.
      - name: Como ficou
        working-directory: discord-bot-gateway
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl status || true
