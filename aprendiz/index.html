<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Aprendiz</title>
<meta name="description" content="Você joga, ela aprende com você, e depois joga sozinha. A conta do quanto ela aprendeu é medida em jogadas que ela nunca viu.">
<meta name="theme-color" content="#0d1013">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icone.svg">
<!-- Sem isto o navegador pede /favicon.ico sozinho e leva 404 em toda visita:
     barulho no console de quem for depurar, e um pedido de rede a mais. -->
<link rel="icon" href="./icone.svg" type="image/svg+xml">
<style>
/* ---------------------------------------------------------------
   Uma tela só, na mão, no escuro.

   Tudo grande: quem joga está com o polegar em cima do vidro, e o número
   que importa tem que ser legível de relance, sem aproximar o rosto.
   --------------------------------------------------------------- */
:root{
  --fundo:#0d1013; --carta:#161b21; --linha:#242c35;
  --texto:#e8edf3; --fraco:#8a95a3;
  --voce:#4ade80;      /* verde: o que é seu */
  --ela:#a78bfa;       /* violeta: o que é dela */
  --comida:#fbbf24;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0; background:var(--fundo); color:var(--texto);
  font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  display:flex; flex-direction:column; align-items:center;
  padding:max(10px,env(safe-area-inset-top)) 12px max(12px,env(safe-area-inset-bottom));
  overscroll-behavior:none; touch-action:manipulation; user-select:none;
}
.tudo{width:100%; max-width:440px; display:flex; flex-direction:column; gap:10px; flex:1}

h1{margin:0; font-size:15px; letter-spacing:.18em; font-weight:800; color:var(--fraco); text-align:center}
h1 b{color:var(--texto)}

/* ---- os dois números ---- */
.numeros{display:grid; grid-template-columns:1fr 1fr; gap:8px}
.num{background:var(--carta); border:1px solid var(--linha); border-radius:14px; padding:9px 12px}
.num .rot{font-size:11px; letter-spacing:.09em; text-transform:uppercase; color:var(--fraco); font-weight:700}
.num .val{font-size:26px; font-weight:800; line-height:1.15; font-variant-numeric:tabular-nums}
.num.dela{border-color:#2f2a45}
.num.dela .val{color:var(--ela)}
.num.sua .val{color:var(--voce)}
.num .sub{font-size:11.5px; color:var(--fraco); margin-top:1px; min-height:16px}

/* A curva do aprendizado: pequena, e só aparece quando existe. */
.curva{height:26px; width:100%; display:block; margin-top:4px}

/* ---- a tela do jogo ---- */
.arena{
  position:relative; background:var(--carta);
  border:1px solid var(--linha); border-radius:16px; overflow:hidden;
  flex:1; min-height:0; display:flex; align-items:center; justify-content:center;
}
canvas{display:block; touch-action:none}
/* Fora do tabuleiro, e não por cima dele: a caixa tapava as casas de baixo,
   e morrer numa casa escondida atrás de um texto é injusto. */
.aviso{
  text-align:center; font-size:13px; color:var(--fraco);
  min-height:34px; display:flex; align-items:center; justify-content:center;
  padding:0 4px;
}
.selo{
  position:absolute; top:10px; left:10px; font-size:11px; font-weight:800;
  letter-spacing:.1em; text-transform:uppercase; padding:4px 9px; border-radius:999px;
}
.selo.voce{background:rgba(74,222,128,.14); color:var(--voce)}
.selo.ela{background:rgba(167,139,250,.16); color:var(--ela)}

/* ---- botões ---- */
.botoes{display:grid; gap:8px; grid-template-columns:1fr 1fr}
button{
  font:inherit; font-weight:700; border-radius:13px; padding:14px 10px;
  border:1px solid var(--linha); background:var(--carta); color:var(--texto);
  cursor:pointer; min-height:52px;
}
button:disabled{opacity:.38; cursor:default}
button.forte{background:var(--ela); border-color:var(--ela); color:#1a1430}
button.larga{grid-column:1 / -1}
.rodape{display:flex; justify-content:space-between; align-items:center; gap:8px; font-size:12px; color:var(--fraco)}
.rodape button{padding:7px 11px; min-height:0; font-size:12px; font-weight:600; border-radius:9px}
</style>
</head>
<body>
<div class="tudo">

  <h1>APR<b>ENDIZ</b></h1>

  <div class="numeros">
    <div class="num sua">
      <div class="rot">Você</div>
      <div class="val" id="pontosVoce">0</div>
      <div class="sub" id="subVoce">recorde 0</div>
    </div>
    <div class="num dela">
      <div class="rot">Ela aprendeu</div>
      <div class="val" id="acerto">—</div>
      <div class="sub" id="subEla">ensine uma partida</div>
      <canvas class="curva" id="curva" hidden></canvas>
    </div>
  </div>

  <div class="arena">
    <div class="selo voce" id="selo">você joga</div>
    <canvas id="tela"></canvas>
  </div>
  <div class="aviso" id="aviso">Arraste o dedo para virar. Ela está te olhando.</div>

  <div class="botoes">
    <button id="btEnsinar">Ensinar de novo</button>
    <button id="btTentar" class="forte" disabled>Deixa ela tentar</button>
  </div>

  <div class="rodape">
    <span id="memoria">nenhuma jogada guardada</span>
    <button id="btEsquecer">Esquecer tudo</button>
  </div>

</div>

<script type="module">
import { jogoNovo, andar, olhar, acaoEntre, DIRECOES, LARGURA, ALTURA, RETO } from "./jogo.js";
import { treinar, decidir, guardarCerebro, lerCerebro } from "./cerebro.js";

const $ = (id) => document.getElementById(id);
const tela = $("tela"), ctx = tela.getContext("2d");

/* ---------------- o que fica guardado ---------------- */
const CHAVE = "aprendiz.v1";
let estado = { memoria: [], cerebro: null, acerto: 0, curva: [], recordeVoce: 0, recordeEla: 0 };

function carregar() {
  try {
    const d = JSON.parse(localStorage.getItem(CHAVE) || "null");
    if (!d) return;
    estado.recordeVoce = d.recordeVoce || 0;
    estado.recordeEla = d.recordeEla || 0;
    estado.acerto = d.acerto || 0;
    estado.curva = d.curva || [];
    estado.cerebro = d.cerebro ? lerCerebro(d.cerebro) : null;
    /* As jogadas voltam como números crus e viram Float64Array de novo: o
       JSON não guarda o tipo, e treinar com array comum daria conta errada
       sem reclamar de nada. */
    estado.memoria = (d.memoria || []).map((m) => ({ x: Float64Array.from(m.x), a: m.a }));
  } catch { /* primeira vez, ou armazenamento bloqueado */ }
}

function salvar() {
  try {
    localStorage.setItem(CHAVE, JSON.stringify({
      recordeVoce: estado.recordeVoce, recordeEla: estado.recordeEla,
      acerto: estado.acerto, curva: estado.curva,
      cerebro: estado.cerebro ? guardarCerebro(estado.cerebro) : null,
      /* Um teto no que se guarda: sem ele, quem joga muito enche o
         armazenamento do navegador e o save começa a falhar calado. As mais
         novas ficam, que são as que representam como você joga HOJE. */
      memoria: estado.memoria.slice(-6000).map((m) => ({ x: Array.from(m.x), a: m.a })),
    }));
  } catch { /* modo privado, ou cheio: o jogo continua, só não lembra */ }
}

/* ---------------- desenho ---------------- */
let lado = 18;
function ajustarTela() {
  const caixa = tela.parentElement.getBoundingClientRect();
  const p = Math.min((caixa.width - 16) / LARGURA, (caixa.height - 16) / ALTURA);
  lado = Math.max(8, Math.floor(p));
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  tela.style.width = (lado * LARGURA) + "px";
  tela.style.height = (lado * ALTURA) + "px";
  tela.width = Math.round(lado * LARGURA * dpr);
  tela.height = Math.round(lado * ALTURA * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  desenhar();
}

function bloco(x, y, cor, encolhe = 1) {
  ctx.fillStyle = cor;
  const r = Math.max(2, lado * 0.22);
  const px = x * lado + encolhe, py = y * lado + encolhe;
  const t = lado - encolhe * 2;
  ctx.beginPath();
  ctx.roundRect ? ctx.roundRect(px, py, t, t, r) : ctx.rect(px, py, t, t);
  ctx.fill();
}

function desenhar() {
  ctx.clearRect(0, 0, tela.width, tela.height);
  /* O TABULEIRO precisa ser visível, e isto não é enfeite.

     Sem ele, o canvas era da mesma cor da moldura e a parede ficava
     invisível: você só descobria onde era a borda morrendo nela. Num jogo em
     que bater na parede é o fim, não ver a parede é o defeito mais grave que
     a tela pode ter -- e ele não aparece lendo o código, só olhando. */
  const L = LARGURA * lado, A = ALTURA * lado;
  ctx.fillStyle = "#10151b";
  ctx.fillRect(0, 0, L, A);
  ctx.strokeStyle = "#2b3644";
  ctx.lineWidth = 2;
  ctx.strokeRect(1, 1, L - 2, A - 2);
  if (!jogo) return;
  const cor = quemJoga === "voce" ? "#4ade80" : "#a78bfa";
  if (jogo.comida) bloco(jogo.comida.x, jogo.comida.y, "#fbbf24", 3);
  jogo.corpo.forEach((c, i) => {
    /* A cabeça cheia e o corpo indo sumindo: sem isso não dá para ver para
       onde ela está indo, que é a única coisa que interessa olhar. */
    ctx.globalAlpha = i === 0 ? 1 : Math.max(0.28, 1 - i / (jogo.corpo.length + 4));
    bloco(c.x, c.y, cor, i === 0 ? 1 : 2);
  });
  ctx.globalAlpha = 1;
}

function desenharCurva() {
  const c = $("curva");
  if (estado.curva.length < 2) { c.hidden = true; return; }
  c.hidden = false;
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  const L = c.clientWidth, A = 26;
  c.width = L * dpr; c.height = A * dpr;
  const g = c.getContext("2d");
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, L, A);
  g.strokeStyle = "#a78bfa"; g.lineWidth = 2; g.lineJoin = "round";
  g.beginPath();
  estado.curva.forEach((v, i) => {
    const x = (i / (estado.curva.length - 1)) * (L - 2) + 1;
    const y = A - 3 - v * (A - 6);
    i ? g.lineTo(x, y) : g.moveTo(x, y);
  });
  g.stroke();
}

/* ---------------- o laço ---------------- */
let jogo = null, quemJoga = "voce", relogio = null, gravando = [];

function pintarNumeros() {
  $("pontosVoce").textContent = quemJoga === "voce" && jogo ? jogo.pontos : estado.recordeVoce;
  $("subVoce").textContent = `recorde ${estado.recordeVoce}`;
  $("acerto").textContent = estado.acerto ? Math.round(estado.acerto * 100) + "%" : "—";
  $("memoria").textContent = estado.memoria.length
    ? `${estado.memoria.length} jogadas suas guardadas`
    : "nenhuma jogada guardada";
  $("btTentar").disabled = !estado.cerebro;
  desenharCurva();
}

function comecar(quem) {
  clearInterval(relogio);
  quemJoga = quem;
  jogo = jogoNovo();
  gravando = [];
  $("selo").className = "selo " + quem;
  $("selo").textContent = quem === "voce" ? "você joga" : "ela joga";
  $("aviso").textContent = quem === "voce"
    ? "Arraste o dedo para virar. Ela está te olhando."
    : "Ela está jogando com o que aprendeu de você.";
  pintarNumeros();
  desenhar();
  /* Ela joga mais devagar do que você jogaria: é para ASSISTIR. Rápido demais
     e ninguém vê o que ela decidiu -- e ver a decisão é o jogo inteiro. */
  relogio = setInterval(passo, quem === "voce" ? 130 : 105);
}

function passo() {
  if (!jogo || !jogo.viva) return;
  let acao = RETO;
  if (quemJoga === "voce") {
    acao = acaoEntre(jogo.dir, rumoPedido ?? jogo.dir);
    /* A jogada entra na memória com o que ela ESTAVA vendo antes de andar. */
    gravando.push({ x: olhar(jogo), a: acao });
  } else {
    acao = decidir(estado.cerebro, olhar(jogo));
  }
  const r = andar(jogo, acao);
  desenhar();
  if (quemJoga === "voce") $("pontosVoce").textContent = jogo.pontos;
  if (r.morreu) acabou();
}

function acabou() {
  clearInterval(relogio);
  if (quemJoga === "voce") {
    estado.recordeVoce = Math.max(estado.recordeVoce, jogo.pontos);
    estado.memoria = estado.memoria.concat(gravando).slice(-6000);
    $("aviso").textContent = `Você fez ${jogo.pontos}. Guardei ${gravando.length} jogadas — treinando…`;
    /* Um respiro antes de travar a tela treinando, senão o "você fez X" nem
       chega a ser lido. */
    setTimeout(aprender, 420);
  } else {
    estado.recordeEla = Math.max(estado.recordeEla, jogo.pontos);
    $("subEla").textContent = `fez ${jogo.pontos} · recorde dela ${estado.recordeEla}`;
    $("aviso").textContent = `Ela fez ${jogo.pontos}. Ensine mais e ela melhora.`;
    salvar();
    pintarNumeros();
  }
}

function aprender() {
  const r = treinar(estado.memoria);
  const antes = estado.acerto;
  estado.cerebro = r.cerebro;
  estado.acerto = r.acerto;
  estado.curva = r.curva;
  salvar();
  pintarNumeros();
  const pct = Math.round(r.acerto * 100);
  const delta = antes ? Math.round((r.acerto - antes) * 100) : 0;
  /* O número pode CAIR, e quando cai a tela diz. Esconder a queda seria a
     mesma mentira da barra de progresso falsa. */
  const seta = !antes ? "" : delta > 0 ? ` (subiu ${delta})` : delta < 0 ? ` (caiu ${-delta})` : " (igual)";
  $("subEla").textContent = `${r.provou} jogadas de prova${seta}`;
  $("aviso").textContent = `Ela acerta ${pct}% do que você faria em situações que nunca viu.`;
}

/* ---------------- o dedo ---------------- */
let rumoPedido = null, toqueX = 0, toqueY = 0;
tela.addEventListener("pointerdown", (e) => { toqueX = e.clientX; toqueY = e.clientY; });
tela.addEventListener("pointerup", (e) => {
  const dx = e.clientX - toqueX, dy = e.clientY - toqueY;
  if (Math.abs(dx) < 14 && Math.abs(dy) < 14) return;
  rumoPedido = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 1 : 3) : (dy > 0 ? 2 : 0);
});
addEventListener("keydown", (e) => {
  const t = { ArrowUp: 0, ArrowRight: 1, ArrowDown: 2, ArrowLeft: 3 }[e.key];
  if (t !== undefined) { rumoPedido = t; e.preventDefault(); }
});

/* ---------------- botões ---------------- */
$("btEnsinar").onclick = () => { rumoPedido = null; comecar("voce"); };
$("btTentar").onclick = () => { if (estado.cerebro) comecar("ela"); };
$("btEsquecer").onclick = () => {
  if (!confirm("Apagar tudo o que ela aprendeu com você?")) return;
  estado = { memoria: [], cerebro: null, acerto: 0, curva: [], recordeVoce: estado.recordeVoce, recordeEla: 0 };
  salvar();
  $("subEla").textContent = "ensine uma partida";
  comecar("voce");
};

addEventListener("resize", ajustarTela);
carregar();
ajustarTela();
if (estado.acerto) $("subEla").textContent = `recorde dela ${estado.recordeEla}`;
comecar("voce");

if ("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js").catch(() => {});
</script>
</body>
</html>
